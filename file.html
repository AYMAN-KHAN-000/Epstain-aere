<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archive File | Epstain Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/x-icon" href="public/images/icon.ico">
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="cursor.js" defer></script>
    <script src="access.js" defer></script>
    <script src="file-viewer.js" defer></script>
  </head>
  <body class="file-viewer-page">
    <div class="file-viewer-shell">
      <header class="file-viewer-header">
        <a class="back-button" id="fileBackButton" href="lib.html">← Back</a>
        <a class="back-button home-button" href="index.html" aria-label="Home">
          <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z" />
          </svg>
          <span>Home</span>
        </a>
      </header>
      <main class="file-viewer-content" id="fileViewerContent" aria-live="polite">
        <img class="file-viewer-image" id="fileViewerImage" alt="" hidden />
        <article class="file-detail-body" id="fileDetails" hidden>
          <p class="item-type" id="fileCategory"></p>
          <h1 class="file-detail-title" id="fileTitle"></h1>
          <p class="file-detail-description" id="fileDescription"></p>
          <dl class="file-metadata" id="fileMetadata"></dl>
          <section class="file-detail-section">
            <h2>PEOPLE / SUBJECTS</h2>
            <div class="file-pills" id="filePeople"></div>
          </section>
          <section class="file-detail-section">
            <h2>TAGS</h2>
            <div class="file-pills" id="fileTags"></div>
          </section>
        </article>
      </main>
    </div>
  </body>
</html>
