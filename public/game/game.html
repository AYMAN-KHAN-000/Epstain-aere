<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Choose a runner and chase the villain." />
    <title>The Great Chase</title>
    <link rel="icon" type="image/x-icon" href="../../public/images/icon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="game.css" />
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <a class="home-button" href="../../index.html" aria-label="Return to home page">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z" />
          </svg>
          <span>Home</span>
        </a>
        <div class="game-title">
          <p class="eyebrow">ARCHIVE ARCADE</p>
          <h1 id="gameName">The Great Chase</h1>
        </div>
        <div class="scoreboard" aria-label="Game statistics">
          <div class="stat">
            <span class="stat-label">DISTANCE</span>
            <strong id="distanceCount">0</strong>
          </div>
          <div class="stat coin-stat">
            <img id="coinIcon" src="dollar.webp" alt="" />
            <span class="stat-label">COINS</span>
            <strong id="coinCount">0</strong>
          </div>
        </div>
      </header>

      <section class="game-panel" aria-label="Runner game">
        <p id="gameDescription" class="game-description"></p>
        <div id="gameStage" class="game-stage" aria-label="Game area">
          <div class="sky-glow" aria-hidden="true"></div>
          <div class="stage-hud">
            <span id="gameStatus" role="status">Choose your runner to begin.</span>
          </div>
          <div class="ground" aria-hidden="true"></div>
          <img id="runner" class="runner sprite" alt="" />
          <img id="villain" class="villain sprite" alt="" />
          <div id="entities" class="entities" aria-hidden="true"></div>

          <div id="startScreen" class="screen-overlay">
            <div class="overlay-card">
              <p class="eyebrow">PICK YOUR RUNNER</p>
              <h2 id="characterScreenTitle">Ready, set, chase!</h2>
              <p id="characterScreenCopy" class="overlay-copy">Choose a character, then jump over planes and grab the coins.</p>
              <div id="characterChoices" class="character-choices"></div>
              <p id="assetNotice" class="asset-notice" role="alert" hidden></p>
              <button id="startButton" class="game-button" type="button" disabled>Start running</button>
            </div>
          </div>

          <div id="gameOverScreen" class="screen-overlay" hidden>
            <div class="overlay-card">
              <p class="eyebrow">CHASE OVER</p>
              <h2 id="gameOverTitle">The plane got you!</h2>
              <p id="gameOverSummary" class="overlay-copy"></p>
              <p id="gameOverRecords" class="record-summary"></p>
              <div class="game-over-actions">
                <button id="restartButton" class="game-button" type="button">Run again</button>
                <button id="gameOverChangeCharacterButton" class="game-button secondary-game-button" type="button">
                  Change character
                </button>
              </div>
            </div>
          </div>
        </div>
        <p id="gameControls" class="game-controls"></p>
      </section>
    </main>
  </body>
</html>
